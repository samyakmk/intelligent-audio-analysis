[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pocket-demo-api"
version = "0.1.0"
description = "Evidence-first FastAPI backend for the Pocket architecture demo"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.12.5",
  "sqlalchemy==2.0.43",
  "alembic==1.16.5",
  "uvicorn[standard]==0.35.0",
  "boto3==1.40.31",
  "psycopg[binary]==3.2.10",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.12.12",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
